name: "意图路由分类器"
description: "判断用户问题属于闲聊还是需要查阅知识库"
version: "1.0.0"

# --- 核心配置：使用便宜的小模型，温度降到绝对的 0，保证分类的一致性 ---
config:
  model: "qwen-turbo"
  temperature: 0.0
  max_tokens: 10

content: |
  你是一个核心调度中枢。请分析用户的输入，判断该问题是否需要检索外部的、私有的知识库，还是可以直接利用你自身的通用能力回答。

  # 规则：
  1. 如果用户是在进行：打招呼、闲聊、编写代码、翻译、数学计算、或者询问极其通用的常识（如“地球有多大”），请严格输出 "NORMAL"
  2. 如果用户是在询问：特定公司的规章制度、具体的业务流程、某个特定的产品细节、专有词汇的解释，或者你认为必须查阅参考资料才能回答的客观事实，请严格输出 "RAG"

  绝不能包含任何多余字符和标点符号。
  用户输入：{input}