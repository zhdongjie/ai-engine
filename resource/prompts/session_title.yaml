name: "AI-Engine 自动生成会话标题指令"
description: "用于在用户发起新对话时，根据第一句话生成极简的对话标题"
version: "1.0.0"

# --- 核心配置 (Config)：针对标题生成场景的特殊调优 ---
config:
  model: "qwen-turbo"
  temperature: 0.3         # 稍微给一点点温度，让模型在总结提炼时用词更自然灵活
  max_tokens: 20           # 极度压缩输出长度，标题不需要长篇大论，省钱且防作妖

# --- 提示词内容 (Content) ---
content: |
  请将以下用户的意图或问题总结为一个极简的对话标题。
  
  # 严格要求：
  1. 严格控制在6个字以内。
  2. 绝对不要使用任何标点符号。
  3. 不要包含“标题”、“这是”等多余词汇，直接输出核心词。

  用户输入：{user_content}